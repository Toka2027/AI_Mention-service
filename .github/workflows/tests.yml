name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r service_engine/requirements.txt

      # Runs from the repo root; pytest.ini sets pythonpath=service_engine and
      # testpaths=service_engine/tests, so no manual `cd` is needed.
      - name: Run tests
        run: python -m pytest
